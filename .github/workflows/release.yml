name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias Python
        run: pip install -r requirements.txt

      # Solo Windows empaqueta Tesseract, Ghostscript y LibreOffice dentro de la app;
      # en macOS/Linux el usuario los instala con brew o su gestor de paquetes.
      - name: Caché de vendor
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/install_vendor.py') }}

      - name: Tesseract, Ghostscript y LibreOffice
        if: runner.os == 'Windows'
        run: python scripts/install_vendor.py

      - name: Pruebas
        if: runner.os == 'Windows'
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Compilar app de escritorio
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run ${{ matrix.dist }} -- --publish never

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
