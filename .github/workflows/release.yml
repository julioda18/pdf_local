name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias Python
        run: pip install -r requirements.txt pyinstaller

      - name: Caché de vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/install_vendor.py') }}

      - name: Tesseract, Ghostscript y LibreOffice
        run: python scripts/install_vendor.py

      - name: Pruebas
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Compilar app de escritorio
        working-directory: electron
        run: |
          npm ci
          npm run dist

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            electron/dist/*.exe
            electron/dist/*.zip
